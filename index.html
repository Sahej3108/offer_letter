<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takkar Polychem - Letter Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .header h1 { font-size: 32px; font-weight: 700; margin-bottom: 10px; }
        .header p { font-size: 14px; opacity: 0.9; }
        .content { padding: 40px; }
        .form-section { margin-bottom: 40px; }
        .form-section h2 {
            font-size: 18px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .form-group { display: flex; flex-direction: column; }
        label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        input, textarea {
            padding: 12px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        textarea { resize: vertical; min-height: 70px; }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            min-width: 140px;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4); }
        .btn-secondary {
            background: #f5f5f5;
            color: #667eea;
            border: 2px solid #667eea;
            flex: 1;
            min-width: 140px;
        }
        .btn-secondary:hover { background: #667eea; color: white; }
        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }
        .success-message.show { display: block; }
        .loading { display: none; text-align: center; padding: 20px; color: #667eea; font-weight: 600; }
        .loading.show { display: block; }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        
        /* Offer Letter Styles */
        .offer-letter {
            font-family: 'Arial', sans-serif;
            font-size: 10pt;
            line-height: 1.4;
            color: #000;
            width: 8.5in;
            height: 11in;
            padding: 0.5in;
            background: white;
            margin: 0 auto;
        }
        
        .offer-header-image {
            width: 100%;
            margin-bottom: 0.3in;
            border-bottom: 1px solid #ccc;
            padding-bottom: 0.15in;
        }
        
        .offer-header-image img {
            width: 100%;
            height: auto;
            max-height: 2in;
        }

        .offer-body-wrapper {
            margin-top: 0.2in;
        }
        
        .offer-to-section {
            margin-bottom: 0.2in;
            font-size: 10pt;
            line-height: 1.4;
        }
        
        .offer-to-label {
            margin-bottom: 2pt;
        }
        
        .offer-recipient-name {
            margin-bottom: 2pt;
        }
        
        .offer-date-section {
            text-align: right;
            margin-bottom: 0.2in;
            font-size: 10pt;
            position: absolute;
            right: 0.5in;
            top: 1.8in;
        }
        .offer-body{
    margin-bottom:18px;
    text-align:justify;
    font-size:14px;
}
        .offer-subject {
            font-weight: bold;
            text-decoration: underline;
            margin-bottom: 0.15in;
            font-size: 10pt;
        }
        
        .offer-salutation {
            margin-bottom: 0.1in;
            font-size: 10pt;
        }
        
        .offer-body {
            font-size: 10pt;
            line-height: 1.5;
            text-align: justify;
            margin-bottom: 0.1in;
        }
        
        .offer-closing {
            margin-top: 0.25in;
            font-size: 10pt;
        }
        
        .offer-signature-block {
            margin-top: 0.3in;
        }

        /* Appointment Letter Styles */
      .appointment-letter{
    width:210mm;
    min-height:297mm;
    padding:18mm;
    background:white;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
    font-size:11pt;
    line-height:1.4;
    color:#000;
}
        .page-break{
    page-break-before: always;
    break-before: page;
    margin-top: 40px;
}
        
        .appt-header-image {
            width: 100%;
            margin-bottom: 0.3in;
            border-bottom: 1px solid #ccc;
            padding-bottom: 0.15in;
        }
        
        .appt-header-image img {
            width: 100%;
            height: auto;
            max-height: 1.8in;
        }
        
        .appt-to-section { margin-bottom: 0.15in; font-size: 10pt; }
        .appt-subject { font-weight: bold; text-transform: uppercase; margin: 0.1in 0; text-decoration: underline; }
        .appt-body { text-align: justify; margin: 0.1in 0; line-height: 1.5; font-size: 10pt; }
        .appt-section { font-weight: bold; text-decoration: underline; margin: 0.15in 0 0.08in 0; font-size: 10pt; }
        .appt-item { margin: 0.05in 0; text-align: justify; line-height: 1.3; font-size: 10pt; }

        @media (max-width: 600px) {
            .header h1 { font-size: 24px; }
            .content { padding: 20px; }
            .form-grid { grid-template-columns: 1fr; }
            button { min-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1> Letter Generator</h1>
            <p>Takkar Polychem Pvt Ltd - Offer & Appointment Letters</p>
        </div>
        <div class="content">
            <div class="success-message" id="successMessage"></div>
            <div class="loading" id="loading">
                <span class="spinner"></span> Generating PDF...
            </div>
            <form id="letterForm">
                <div class="form-section">
                    <h2>Personal Information</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Candidate Name *</label>
                            <input type="text" id="candidateName" required placeholder="e.g., Pankaj Kumar">
                        </div>
                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" id="email" required>
                        </div>
                        <div class="form-group">
                            <label>Phone *</label>
                            <input type="tel" id="phone" required>
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Address *</label>
                            <textarea id="address" required placeholder="e.g., Bypass road Shamli, Distt- Shamli, UP, 247776"></textarea>
                        </div>
                    </div>
                </div>
                <div class="form-section">
                    <h2>Employment Details</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Position *</label>
                            <input type="text" id="position" required placeholder="e.g., MIS Executive">
                        </div>
                        <div class="form-group">
                            <label>Reporting To *</label>
                            <input type="text" id="reportingTo" required placeholder="e.g., Amit Takkar">
                        </div>
                        <div class="form-group">
                            <label>Monthly Salary (Rs.) *</label>
                            <input type="number" id="salary" required placeholder="e.g., 18000">
                        </div>
                        <div class="form-group">
                            <label>Date of Joining *</label>
                            <input type="date" id="joiningDate" required>
                        </div>
                        <div class="form-group">
    <label for="director">Director</label>
    <select id="director" name="director" class="form-control">
        <option value="">Select Director</option>
        <option value="Mr. Deepak Takkar">Mr. Deepak Takkar</option>
        <option value="Mr. Amit Takkar">Mr. Amit Takkar</option>
    </select>
</div>
                    </div>
                </div>
                <div class="form-section">
                    <h2>Document Dates</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Offer Letter Date *</label>
                            <input type="date" id="offerLetterDate" required>
                        </div>
                        <div class="form-group">
                            <label>Application Date *</label>
                            <input type="date" id="applicationDate" required>
                        </div>
                        <div class="form-group">
                            <label>Interview Date *</label>
                            <input type="date" id="interviewDate" required>
                        </div>
                    </div>
                </div>
                <div class="button-group">
                    <button type="submit" class="btn-primary">Generate Offer Letter</button>
                    <button type="button" id="genAppt" class="btn-primary">Generate Appointment Letter</button>
                    <button type="reset" class="btn-secondary">Clear</button>
                </div>
            </form>
        </div>
    </div>
    <div id="letterContent" class="hidden"></div>

    <script>
        const { jsPDF } = window.jspdf;

        function formatDate(dateString) {
    const date = new Date(dateString);

    return date.toLocaleDateString('en-GB', {
        day: '2-digit',
        month: 'short',
        year: 'numeric'
    });
}

        function getData() {
            return {
                name: document.getElementById('candidateName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                position: document.getElementById('position').value,
                reportingTo: document.getElementById('reportingTo').value,
                salary: document.getElementById('salary').value,
                joiningDate: document.getElementById('joiningDate').value,
                offerDate: document.getElementById('offerLetterDate').value,
                appDate: document.getElementById('applicationDate').value,
                intDate: document.getElementById('interviewDate').value
                director: document.getElementById('director').value

            };
        }

        function createOfferLetter(d) {
    return `
    <div class="offer-letter" 
        style="
            width:210mm;
            min-height:297mm;
            background:white;
            padding:0 18mm 18mm 18mm;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
            color:#000;
            line-height:1.7;
        ">

        <div class="offer-header-image">
            <img 
                src="https://lh3.googleusercontent.com/d/12nbtBC4MabKhhoT72iY37NWI83QjJxUS"
                alt="Company Header"
                style="
                    width:100%;
                    height:auto;
                    display:block;
                    margin-bottom:20px;
                "
            >
        </div>

        <div style="margin-top:10px;">

            <div style="
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:10x;
">

    <div>
        <div style="font-weight:bold;">To,</div>

        <div style="margin-top:5px;font-weight:bold;">
             ${d.name},
        </div>

        <div style="
    margin-top:0;
    white-space:pre-line;
    line-height:1.2;
">
    ${d.address}
</div>
    </div>

    <div style="
        font-weight:bold;
        text-align:right;
    ">
        Date: ${formatDate(d.offerDate)}
    </div>

</div>

            <div style="
                font-size:15px;
                font-weight:bold;
                margin-bottom:15px;
            ">
                Subject: Offer for the Role of ${d.position}
            </div>

            <div style="
                margin-bottom:20px;
                font-weight:bold;
            ">
                Dear ${d.name.split(' ')[0]},
            </div>

            <div class="offer-body">
We are pleased to offer you the position of <b>${d.position}</b> at
<b>Takkar Polychem Pvt. Ltd.</b>, located at Plot No. 19, Ecotech XII,
Greater Noida. This is a full-time role and you will report to
<b>${d.reportingTo}</b>.
</div>

<div class="offer-body">
Takkar Polychem Pvt. Ltd. is a leading manufacturer of specialized compounds
serving the wire & cable and OEM industries. Your role will encompass
responsibilities aligned with the position of <b>${d.position}</b>,
including but not limited to coordination, reporting, documentation,
process monitoring, business support and assisting in day-to-day operations.
</div>

<div class="offer-body">
As a dynamic organization, your scope of work will not be limited to predefined
tasks and is expected to evolve continuously based on business requirements,
your performance and your ability to take ownership of new initiatives.
</div>

<div class="offer-body">
Your performance will be assessed through structured reporting systems designed
to track deliverables, efficiency, quality of work and overall contribution.
We encourage you to consistently maintain high standards of professionalism,
accuracy and accountability.
</div>

<div class="offer-body">
Your expected starting date is <b>${formatDate(d.joiningDate)}</b>.
You will be asked to sign a confidentiality and non-disclosure agreement
at the beginning of your employment.
</div>

<div class="offer-body">
We hope to offer you a challenging and rewarding career with a high level
of job satisfaction and opportunities for career development.
</div>

<div class="offer-body">
Please sign the duplicate copy of this letter as an acceptance of our offer
for the position of <b>${d.position}</b>.
</div>

<div class="offer-body">
We look forward to having you on our team.
</div>

            <div style="
                margin-top:55px;
            ">

                <div style="margin-bottom:10px;">
                    Best Regards,
                </div>

                <div style="margin-bottom:60px;">
                    For Takkar Polychem Pvt Ltd.
                </div>

                <div style="font-weight:bold;">
    <div>${d.director}</div>
    <div>(Director)</div>
</div>

            </div>

        </div>

    </div>
    


    `;
}


        function createAppointmentLetter(d) {

const isFemale = d.gender && d.gender.toLowerCase() === 'female';
const shiftTiming = isFemale
    ? '9:00 AM and end at 6:00 PM'
    : '9:30 AM and end at 6:30 PM';
const reportingTime = isFemale ? '8:50 AM' : '9:20 AM';

return `

<div class="appointment-letter">

<style>
    * { box-sizing: border-box; }

    .appointment-letter {
        font-family: Arial, sans-serif;
        font-size: 10pt;
        line-height: 1.55;
        color: #000;
        width: 100%;
        max-width: 210mm;
        margin: 0 auto;
    }

    .appt-page {
        width: 100%;
        max-width: 210mm;
        min-height: 297mm;
        padding: 0.5mm 15mm 15mm 15mm;
        margin: 0 auto 16px auto;
        background: #fff;
        position: relative;
        overflow: hidden;
        word-wrap: break-word;
        overflow-wrap: break-word;
    }

    .appt-page-n {
        padding: 10.5mm 15mm 15mm 15mm;
    }

    .appt-page > * {
        max-width: 100%;
    }

    @media print {
        body { background: #fff; margin: 0; padding: 0; }

        @page {
            size: A4;
            margin: 10.5mm 15mm 15mm 15mm;
        }

        @page :first {
            margin-top: 0.5mm;
        }

        .appointment-letter {
            max-width: 100%;
        }

        .appt-page {
            width: 100%;
            max-width: 100%;
            min-height: auto;
            padding: 0 !important;
            margin: 0 !important;
            overflow: visible;
        }

        .appt-new-page {
            page-break-before: always;
            break-before: page;
        }
    }

    .appt-clause {
        margin-bottom: 7px;
        text-align: justify;
        page-break-inside: avoid;
        break-inside: avoid;
        orphans: 3;
        widows: 3;
        word-wrap: break-word;
        overflow-wrap: break-word;
    }

    .appt-section-heading {
        font-weight: bold;
        text-decoration: underline;
        margin: 12px 0 5px 0;
        page-break-after: avoid;
        break-after: avoid;
    }

    .no-break {
        page-break-inside: avoid;
        break-inside: avoid;
    }

    .appt-header-image img {
        width: 100%;
        max-width: 100%;
        height: auto;
        display: block;
        margin-bottom: 10px;
    }
</style>

<!-- ═══════════════════════════════════════════════════════
     PAGE 1 — Header · To · Subject · Introduction · Clause 1
     ═══════════════════════════════════════════════════════ -->
<div class="appt-page appt-page-1">

    <div class="appt-header-image">
        <img src="https://lh3.googleusercontent.com/d/12nbtBC4MabKhhoT72iY37NWI83QjJxUS" alt="Company Header">
    </div>

    <div class="appt-clause" style="margin-bottom:10px;">
        <b>To,</b><br>
        ${d.name}<br>
        ${d.address}<br>
        ${d.phone}<br>
        ${d.email}
    </div>

    <div class="appt-clause" style="font-size:11pt; font-weight:bold; margin:10px 0;">
        Subject: APPOINTMENT LETTER
    </div>

    <div class="appt-clause">Dear ${d.name.split(' ')[0]},</div>

    <div class="appt-clause">
        With reference to your application dated <b>${formatDate(d.appDate)}</b> and subsequent
        interview held on <b>${formatDate(d.intDate)}</b> we are pleased to offer you the post of
        <b>${d.position}</b> in our organization on the following terms and conditions.
    </div>

    <div class="appt-clause" style="margin-left:36px; line-height:1.9; margin-top:6px; margin-bottom:6px;">
        <b>Designation : ${d.position}</b><br>
        <b>at Rs. ${d.salary} Per month</b><br>
        <b>w.e.f ${formatDate(d.joiningDate)}</b>
    </div>

    <div class="appt-clause">
        The details of your remuneration are enumerated in <b>Annexure A</b>, enclosed. The payment
        of salary and benefits shall be subject to deduction of Income Tax as per the prevailing
        Income Tax rates and other statutory deductions, as may be required under the applicable
        legislation in force from time to time. Your compensation will be renewed under the
        Company's policies from time to time, at the sole discretion of the Company.
    </div>

    <div class="no-break">
        <div class="appt-section-heading">PROBATION &amp; CONFIRMATION</div>
        <div class="appt-clause">
            <b>1.</b> You will be on probation for the first <b>6 months</b> of your employment.
            You will not be deemed to be confirmed until the letter of confirmation has been issued
            to you and till such time you shall be on probation on the terms and conditions
            applicable to the initial probationary period as mentioned in this letter. During or at
            the expiry of the period of probation or such extended period of probation, your
            services are liable to be terminated at any time without notice or without assigning any
            reason or payment of compensation in lieu thereof.
        </div>
    </div>

</div>

<!-- ═══════════════════════════════════════════════════════
     PAGE 2 — Clauses 2 · 3 · 4 · 5 · 6 · 7 · 8
     ═══════════════════════════════════════════════════════ -->
<div class="appt-page appt-page-n appt-new-page">

    <div class="appt-clause">
        <b>2.</b> After confirmation, your employment can be terminated/discharged by giving one
        month's notice in writing or one month's salary/wages in lieu thereof by either side. In
        case you leave your employment without giving notice in the said manner, the management
        shall have the right to deduct one month's salary or an amount equal to the number of days
        the notice falls short of money that may be due to you, or shall recover such amount in the
        manner it deems fit. Further, in case of resignation, the management reserves the right to
        accept the same with immediate effect.
    </div>

    <div class="appt-clause">
        <b>3.</b> Your place of posting will, at present, be at Greater Noida. You are liable to
        be transferred/posted from your current branch of the company to any other
        establishment/branches/sister concerns of the company now in existence or that may come up
        in future anywhere where the company premises are located without any extra remuneration
        which may arise as an incidence of service. You are also liable to be transferred from one
        department to another, from one shift to another whether day or night. Your refusal to
        carry out such orders will constitute misconduct.
    </div>

    <div class="appt-clause">
        <b>4.</b> Your shift timings start from ${shiftTiming}, from Monday to Saturday or as
        decided by the Management, and your reporting time will be ${reportingTime}.
    </div>

    <div class="appt-clause">
        <b>5.</b> Every employee is required to complete a minimum of <b>9 (nine) working hours</b>
        per day. If you report late to work, you will be required to stay and complete the full
        9-hour working period accordingly, and will not be permitted to leave before the completion
        of 9 hours from the time of your arrival. Repeated late arrivals may be treated as
        indiscipline and may attract suitable action as per company policy.
    </div>

    <div class="no-break">
        <div class="appt-section-heading">TERMINATION OF SERVICES</div>
        <div class="appt-clause">
            <b>6.</b> Your services are liable to be terminated without any notice if any
            information tendered by you in your application for employment on the basis of which
            this offer is made is found to be false, misleading, or certain facts are found to have
            been omitted or exaggerated in it.
        </div>
    </div>

    <div class="appt-clause">
        <b>7.</b> Continued absence from duty for 8 days without express permission in writing of
        the management or overstay of sanctioned leave for 8 days shall tantamount to voluntary
        abandonment of service, and your name will be struck off from the rolls of the company
        without any notice to you. You shall faithfully and to the best of your ability perform
        your duties that may be entrusted to you from time to time by the Management. You will be
        bound by the rules, regulations and orders promulgated by the Management in relation to
        the conduct, discipline, and policy matters.
    </div>

    <div class="appt-clause">
        <b>8.</b> In the event of your becoming unfit for performance of your normal duties as a
        consequence of ill health, accident etc., you are liable to be discharged from services by
        serving one month's notice by the management or making payment in lieu thereof. Your
        appointment and its continuance in the organization is subject to you remaining medically,
        physically and mentally fit. Further, the management reserves the right to get you examined
        by the medical officer of the company or a Medical Practitioner nominated by the company,
        wherein you shall undergo such medical examination as required. If you are found medically
        unfit, the management reserves the right to take appropriate action wherein your services
        may be discharged. Failure to comply with such instructions shall tantamount to gross
        misconduct leading to dismissal from service.
    </div>

</div>

<!-- ═══════════════════════════════════════════════════════
     PAGE 3 — Clauses 9 · 10 · 11 · 12
     ═══════════════════════════════════════════════════════ -->
<div class="appt-page appt-page-n appt-new-page">

    <div class="appt-clause">

        async function makePDF(html, filename) {
            try {
                const container = document.getElementById('letterContent');
                container.innerHTML = html;
                container.classList.remove('hidden');
                
                const canvas = await html2canvas(container.firstElementChild, {
    scale: 2,
    useCORS: true,
    allowTaint: true,
    backgroundColor: '#ffffff',
    imageTimeout: 0
});

                const imgData = canvas.toDataURL('image/png');
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                const imgWidth = pageWidth;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                const totalPages = Math.ceil(imgHeight / pageHeight);

                let position = 0;
                let heightLeft = imgHeight;

                pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;

                while (heightLeft >= pageHeight) {
    position = heightLeft - imgHeight;

    if (heightLeft - pageHeight <= 1) {
        break;
    }

    pdf.addPage();
    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);

    heightLeft -= pageHeight;
}

                pdf.save(filename + '.pdf');
                container.classList.add('hidden');
                return true;
            } catch (err) {
                alert('Error: ' + err.message);
                console.error(err);
                return false;
            }
        }
