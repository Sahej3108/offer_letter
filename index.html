<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takkar Polychem - Letter Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .form-section {
            margin-bottom: 40px;
        }

        .form-section h2 {
            font-size: 18px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea {
            padding: 12px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 200px;
            padding: 14px 28px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: 600;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .form-section.two-column .form-grid {
            grid-template-columns: repeat(2, 1fr);
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 24px;
            }

            .content {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-section.two-column .form-grid {
                grid-template-columns: 1fr;
            }

            button {
                min-width: 100%;
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Letter Generator</h1>
            <p>Takkar Polychem Pvt Ltd - Offer & Appointment Letters</p>
        </div>

        <div class="content">
            <div class="success-message" id="successMessage"></div>
            <div class="loading" id="loading">
                <span class="spinner"></span>
                Generating letters... Please wait
            </div>

            <form id="letterForm">
                <!-- Personal Information -->
                <div class="form-section">
                    <h2>Personal Information</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="candidateName">Candidate Name *</label>
                            <input type="text" id="candidateName" name="candidateName" required placeholder="e.g., John Doe">
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address *</label>
                            <input type="email" id="email" name="email" required placeholder="e.g., john@example.com">
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" name="phone" required placeholder="e.g., +91-8218624137">
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="address">Address *</label>
                            <textarea id="address" name="address" required placeholder="e.g., Bypass road Shamli, Distt- Shamli, UP, 247776"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Employment Details -->
                <div class="form-section">
                    <h2>Employment Details</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="position">Position *</label>
                            <input type="text" id="position" name="position" required placeholder="e.g., MIS Executive">
                        </div>
                        <div class="form-group">
                            <label for="salary">Monthly Salary (in Rs.) *</label>
                            <input type="number" id="salary" name="salary" required placeholder="e.g., 18000">
                        </div>
                        <div class="form-group">
                            <label for="joiningDate">Date of Joining (w.e.f) *</label>
                            <input type="date" id="joiningDate" name="joiningDate" required>
                        </div>
                    </div>
                </div>

                <!-- Document Details -->
                <div class="form-section">
                    <h2>Document Details</h2>
                    <div class="form-grid two-column">
                        <div class="form-group">
                            <label for="offerLetterDate">Offer Letter Date *</label>
                            <input type="date" id="offerLetterDate" name="offerLetterDate" required>
                        </div>
                        <div class="form-group">
                            <label for="applicationDate">Application Date *</label>
                            <input type="date" id="applicationDate" name="applicationDate" required>
                        </div>
                        <div class="form-group">
                            <label for="interviewDate">Interview Date *</label>
                            <input type="date" id="interviewDate" name="interviewDate" required>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="button-group">
                    <button type="submit" class="btn-primary">Generate Both Letters</button>
                    <button type="reset" class="btn-secondary">Clear Form</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Format date to DD MMM YYYY (e.g., 05 Feb 2024)
        function formatDateLong(dateString) {
            const options = { day: '2-digit', month: 'short', year: 'numeric' };
            const date = new Date(dateString + 'T00:00:00');
            return date.toLocaleDateString('en-US', options);
        }

        // Generate Offer Letter HTML
        function generateOfferLetter(data) {
            return `
            <html>
            <head>
                <style>
                    body {
                        font-family: 'Calibri', Arial, sans-serif;
                        margin: 40px;
                        line-height: 1.6;
                        color: #000;
                        font-size: 12px;
                    }
                    .company-name { font-size: 14px; font-weight: bold; margin-bottom: 3px; }
                    .company-subtitle { font-size: 9px; font-weight: bold; margin-bottom: 5px; }
                    .company-details { font-size: 8px; line-height: 1.4; margin-bottom: 10px; }
                    .to-section { margin-bottom: 20px; font-size: 12px; }
                    .date-section { text-align: right; font-size: 12px; margin-bottom: 20px; }
                    .subject { font-weight: bold; text-decoration: underline; margin-bottom: 10px; }
                    .body-text { text-align: justify; margin-bottom: 15px; line-height: 1.7; }
                    .signature-line { margin-top: 30px; font-size: 12px; }
                </style>
            </head>
            <body>
                <div style="text-align: center; margin-bottom: 30px;">
                    <div class="company-name">TAKKAR POLYCHEM PRIVATE LIMITED</div>
                    <div class="company-subtitle">(MANUFACTURERS OF SPECIALISED COMPOUNDS AND MASTER BATCHES)</div>
                    <div class="company-details">
                        PLOT NO 19, ECOTECH - XII, GREATER NOIDA - 201308 (UP)<br>
                        CIN NO. - U25209DL2022PTC392480 TAN NO. - DELT20112B<br>
                        PHONE: +91-8178526417, Email: info@takkarpolychem.com
                    </div>
                </div>

                <div class="to-section">
                    <div>To,</div>
                    <div>Mr ${data.candidateName},</div>
                    <div>${data.address}</div>
                </div>

                <div class="date-section">Dated: - ${formatDateLong(data.offerLetterDate)}</div>

                <div class="subject">Subject: - Offer Letter for the post of ${data.position}</div>

                <div style="margin-bottom: 15px;">Dear ${data.candidateName.split(' ')[0]},</div>

                <div class="body-text">
                    We are delighted to offer you the opportunity for the position of <strong>${data.position}</strong> with our Company <strong>M/S Takkar Polychem Pvt Ltd</strong>, Plot No 19, Ecotech XII, Greater Noida. This is a full-time role, and you will be reporting to <strong>Mr. Amit Takkar (Director)</strong>.
                </div>

                <div class="body-text">
                    Your expected starting date is <strong>${formatDateLong(data.joiningDate)}</strong>. You will be asked to sign a confidentiality and non-disclosure agreement at the beginning of your employment.
                </div>

                <div class="body-text">
                    We hope to offer you a challenging and rewarding career with a high level of job satisfaction and opportunities for career development.
                </div>

                <div class="body-text">
                    Please sign the duplicate copy of this letter as an acceptance of our offer for the position of <strong>${data.position}</strong>.
                </div>

                <div class="body-text">
                    We are all looking forward to your joining our team.
                </div>

                <div style="margin: 20px 0 15px 0;">Best regards,</div>
                <div style="margin-bottom: 5px;">For Takkar Polychem Pvt Ltd.</div>

                <div class="signature-line">
                    Amit Takkar<br>
                    (Director)
                </div>
            </body>
            </html>
            `;
        }

        // Generate Appointment Letter HTML (shortened version for testing)
        function generateAppointmentLetter(data) {
            return `
            <html>
            <head>
                <style>
                    body {
                        font-family: 'Calibri', Arial, sans-serif;
                        margin: 40px;
                        line-height: 1.6;
                        color: #000;
                        font-size: 11px;
                    }
                    .to-section { margin-bottom: 20px; }
                    .subject { font-weight: bold; text-transform: uppercase; margin: 20px 0; }
                    .body-text { text-align: justify; margin-bottom: 15px; line-height: 1.6; }
                    .section-title { font-weight: bold; text-decoration: underline; margin: 20px 0 10px 0; }
                    .list-item { margin-bottom: 12px; text-align: justify; line-height: 1.6; }
                    .signature-line { margin-top: 30px; font-size: 11px; }
                </style>
            </head>
            <body>
                <div class="to-section">
                    <div><strong>Mr. ${data.candidateName}</strong></div>
                    <div>${data.address}</div>
                    <div>${data.phone}</div>
                    <div>${data.email}</div>
                </div>

                <div class="subject">Subject: APPOINTMENT LETTER</div>

                <div class="body-text">
                    With reference to your application dated <strong>${formatDateLong(data.applicationDate)}</strong> and subsequent interview held on <strong>${formatDateLong(data.interviewDate)}</strong> we are pleased to offer you the post of <strong>${data.position}</strong> in our organization on the following terms and conditions.
                </div>

                <div style="margin-bottom: 10px;">
                    <div><strong>Designation : ${data.position}</strong></div>
                    <div><strong>at Rs. ${data.salary} Per month</strong></div>
                    <div><strong>w.e.f ${formatDateLong(data.joiningDate)}</strong></div>
                </div>

                <div class="body-text">
                    The details of your remuneration are enumerated in Annexure A, enclosed. The payment of salary and benefits shall be subject to deduction of Income Tax as per the prevailing Income Tax rates and other statutory deductions, as may be required under the applicable Legislation in force from time to time. Your compensation will be renewed under the Company's policies from time to time, at the sole discretion of the Company.
                </div>

                <div class="section-title">PROBATION & CONFIRMATION</div>

                <div class="list-item">
                    <strong>1.</strong> You will be on probation for the first 6 months of your employment. You will not be deemed to be confirmed until the letter of confirmation has been issued to you and till such time you shall be on probation on the terms and conditions applicable to the initial probationary period as mentioned in this letter. During or at the expiry of the period of probation or such extended period of probation, your services are liable to be terminated at any time without notice or without assigning any reason or payment of compensation in lieu thereof.
                </div>

                <div class="list-item">
                    <strong>2.</strong> After confirmation, your employment can be terminated/discharged by giving one month's notice in writing or one month's salary/wages in lieu thereof by either side. In case you leave your employment without giving notice in the said manner, the management shall have the right to deduct one month's salary or an amount equal to the number of days the notice falls short of money that may be due to you, or shall recover such amount in the manner it deems fit. Further, in case of resignation, the management reserves the right to accept the same with immediate effect.
                </div>

                <div class="list-item">
                    <strong>3.</strong> Your place of posting will, at present, be at <strong>Greater Noida</strong>. You are liable to be transferred/posted to any other establishment/branches/sister concerns of the company now in existence or that may come up in future anywhere where the company premises are located without any extra remuneration. You are also liable to be transferred from one department to another, from one shift to another shift day or night. Your refusal to carry out such orders will constitute misconduct.
                </div>

                <div class="list-item">
                    <strong>4.</strong> Your shift timings start from 9:30 AM and end at 6:30 PM, from Monday to Saturday or as decided by the Management, and your reporting time will be 9.20 AM.
                </div>

                <div class="section-title">TERMINATION OF SERVICES</div>

                <div class="list-item">
                    <strong>5.</strong> Your services are liable to be terminated without any notice if any information tendered by you in your application for employment on the basis of which this offer is made is found to be false, misleading, or certain facts are found to have been omitted or exaggerated in it.
                </div>

                <div class="section-title">SALARY AND EMOLUMENTS</div>

                <div class="list-item">
                    <strong>10.</strong> Your Annual compensation will be as per Annexure A, subject to TDS and other Govt and statutory deductions as applicable from time to time. During the tenure of service, you will keep your emoluments secret from other members of this organization and will treat all information coming to you as strictly confidential.
                </div>

                <div class="section-title">GENERAL RULES & REGULATIONS</div>

                <div class="list-item">
                    <strong>15.</strong> As a ${data.position}, you are expected to uphold accuracy, confidentiality, and integrity in managing company data and reports. Your conduct must reflect professionalism, attention to detail, and adherence to ethical data handling practices while supporting management with reliable insights for decision-making.
                </div>

                <div style="margin-top: 40px;">
                    Authorized Signatory<br>
                    <strong>Amit Takkar</strong><br>
                    (Director)<br>
                    <strong>TAKKAR POLYCHEM PVT. LTD.</strong>
                </div>

                <div style="margin-top: 40px;">
                    <div>(Signature of Employee)</div>
                    <div><strong>Accepted: _____________</strong></div>
                </div>
            </body>
            </html>
            `;
        }

        // Download PDF
        async function downloadPDF(html, filename) {
            try {
                const element = document.createElement('div');
                element.innerHTML = html;
                element.style.position = 'absolute';
                element.style.left = '-9999px';
                element.style.width = '210mm';
                
                document.body.appendChild(element);
                
                const opt = {
                    margin: [10, 10, 10, 10],
                    filename: filename,
                    image: { type: 'jpeg', quality: 0.95 },
                    html2canvas: { scale: 2, logging: false, allowTaint: true, useCORS: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                
                await html2pdf().set(opt).from(element).save();
                document.body.removeChild(element);
                
            } catch (error) {
                console.error('Error generating PDF:', error);
                throw error;
            }
        }

        // Form submission handler
        document.getElementById('letterForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const loading = document.getElementById('loading');
            const successMessage = document.getElementById('successMessage');

            // Get form data
            const data = {
                candidateName: document.getElementById('candidateName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                position: document.getElementById('position').value,
                salary: document.getElementById('salary').value,
                joiningDate: document.getElementById('joiningDate').value,
                offerLetterDate: document.getElementById('offerLetterDate').value,
                applicationDate: document.getElementById('applicationDate').value,
                interviewDate: document.getElementById('interviewDate').value
            };

            console.log('Generating PDFs for:', data.candidateName);

            loading.classList.add('show');
            successMessage.classList.remove('show');

            try {
                // Generate Offer Letter
                console.log('Generating Offer Letter...');
                const offerHTML = generateOfferLetter(data);
                await downloadPDF(offerHTML, `${data.candidateName}_Offer_Letter.pdf`);

                // Wait 2 seconds
                await new Promise(resolve => setTimeout(resolve, 2000));

                // Generate Appointment Letter
                console.log('Generating Appointment Letter...');
                const appointmentHTML = generateAppointmentLetter(data);
                await downloadPDF(appointmentHTML, `${data.candidateName}_Appointment_Letter.pdf`);

                console.log('✓ Both PDFs generated successfully!');
                
                loading.classList.remove('show');
                successMessage.textContent = `✓ Successfully generated both letters for ${data.candidateName}!`;
                successMessage.classList.add('show');

                setTimeout(() => {
                    successMessage.classList.remove('show');
                }, 5000);

            } catch (error) {
                console.error('Error:', error);
                loading.classList.remove('show');
                alert('Error generating PDFs: ' + error.message);
            }
        });

        // Verify libraries on load
        window.addEventListener('load', function() {
            console.log('✓ Page loaded');
            console.log('✓ html2pdf available:', typeof html2pdf !== 'undefined');
        });
    </script>
</body>
</html>
