<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takkar Polychem - Letter Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .form-section {
            margin-bottom: 40px;
        }

        .form-section h2 {
            font-size: 18px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea {
            padding: 12px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 200px;
            padding: 14px 28px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: 600;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 24px; }
            .content { padding: 20px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Letter Generator</h1>
            <p>Takkar Polychem Pvt Ltd - Offer & Appointment Letters</p>
        </div>

        <div class="content">
            <div class="success-message" id="successMessage"></div>
            <div class="loading" id="loading">
                <span class="spinner"></span>
                Generating letters... Please wait (10-15 seconds)
            </div>

            <form id="letterForm">
                <div class="form-section">
                    <h2>Personal Information</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="candidateName">Candidate Name *</label>
                            <input type="text" id="candidateName" required placeholder="e.g., John Doe">
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address *</label>
                            <input type="email" id="email" required placeholder="e.g., john@example.com">
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" required placeholder="e.g., +91-8218624137">
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="address">Address *</label>
                            <textarea id="address" required placeholder="e.g., Bypass road Shamli, Distt- Shamli, UP, 247776"></textarea>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Employment Details</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="position">Position *</label>
                            <input type="text" id="position" required placeholder="e.g., MIS Executive">
                        </div>
                        <div class="form-group">
                            <label for="salary">Monthly Salary (in Rs.) *</label>
                            <input type="number" id="salary" required placeholder="e.g., 18000">
                        </div>
                        <div class="form-group">
                            <label for="joiningDate">Date of Joining *</label>
                            <input type="date" id="joiningDate" required>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Document Dates</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="offerLetterDate">Offer Letter Date *</label>
                            <input type="date" id="offerLetterDate" required>
                        </div>
                        <div class="form-group">
                            <label for="applicationDate">Application Date *</label>
                            <input type="date" id="applicationDate" required>
                        </div>
                        <div class="form-group">
                            <label for="interviewDate">Interview Date *</label>
                            <input type="date" id="interviewDate" required>
                        </div>
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-primary">Generate Offer Letter</button>
                    <button type="button" id="genAppt" class="btn-primary">Generate Appointment Letter</button>
                    <button type="reset" class="btn-secondary">Clear Form</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function formatDateLong(dateString) {
            const options = { day: '2-digit', month: 'short', year: 'numeric' };
            const date = new Date(dateString + 'T00:00:00');
            return date.toLocaleDateString('en-US', options);
        }

        function getFormData() {
            return {
                candidateName: document.getElementById('candidateName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                position: document.getElementById('position').value,
                salary: document.getElementById('salary').value,
                joiningDate: document.getElementById('joiningDate').value,
                offerLetterDate: document.getElementById('offerLetterDate').value,
                applicationDate: document.getElementById('applicationDate').value,
                interviewDate: document.getElementById('interviewDate').value
            };
        }

        function generateOfferLetterHTML(data) {
            return `<!DOCTYPE html><html><head><style>body{font-family:Calibri,Arial;margin:40px;font-size:12px;line-height:1.6}.header{text-align:center;margin-bottom:30px}.company-name{font-size:14px;font-weight:bold}.company-sub{font-size:9px;font-weight:bold;margin:5px 0}.company-details{font-size:8px;line-height:1.5;margin:10px 0}.to-section{margin:20px 0}.date{text-align:right;margin:20px 0}.subject{font-weight:bold;text-decoration:underline;margin:15px 0}.body{text-align:justify;margin:15px 0;line-height:1.7}.signature{margin-top:40px}</style></head><body><div class="header"><div class="company-name">TAKKAR POLYCHEM PRIVATE LIMITED</div><div class="company-sub">(MANUFACTURERS OF SPECIALISED COMPOUNDS AND MASTER BATCHES)</div><div class="company-details">PLOT NO 19, ECOTECH - XII, GREATER NOIDA - 201308 (UP)<br>CIN NO. - U25209DL2022PTC392480 TAN NO. - DELT20112B<br>PHONE: +91-8178526417, Email: info@takkarpolychem.com</div></div><div class="to-section"><p>To,<br>Mr ${data.candidateName},<br>${data.address}</p></div><div class="date">Dated: - ${formatDateLong(data.offerLetterDate)}</div><div class="subject">Subject: - Offer Letter for the post of ${data.position}</div><p>Dear ${data.candidateName.split(' ')[0]},</p><div class="body">We are delighted to offer you the opportunity for the position of <b>${data.position}</b> with our Company <b>M/S Takkar Polychem Pvt Ltd</b>, Plot No 19, Ecotech XII, Greater Noida. This is a full-time role, and you will be reporting to <b>Mr. Amit Takkar (Director)</b>.</div><div class="body">Your expected starting date is <b>${formatDateLong(data.joiningDate)}</b>. You will be asked to sign a confidentiality and non-disclosure agreement at the beginning of your employment.</div><div class="body">We hope to offer you a challenging and rewarding career with a high level of job satisfaction and opportunities for career development.</div><div class="body">Please sign the duplicate copy of this letter as an acceptance of our offer for the position of <b>${data.position}</b>.</div><div class="body">We are all looking forward to your joining our team.</div><div style="margin:30px 0">Best regards,<br><br>For Takkar Polychem Pvt Ltd.<br><br>Amit Takkar<br>(Director)</div></body></html>`;
        }

        function generateAppointmentLetterHTML(data) {
            return `<!DOCTYPE html><html><head><style>body{font-family:Calibri,Arial;margin:40px;font-size:11px;line-height:1.6}.header{margin-bottom:20px}.subject{font-weight:bold;text-transform:uppercase;margin:15px 0}.body{text-align:justify;margin:15px 0;line-height:1.6}.section{font-weight:bold;text-decoration:underline;margin:20px 0 10px 0}.item{margin:10px 0;text-align:justify}</style></head><body><div class="header"><p><b>To,</b><br><b>Mr. ${data.candidateName}</b><br>${data.address}<br>${data.phone}<br>${data.email}</p></div><div class="subject">Subject: APPOINTMENT LETTER</div><div class="body">With reference to your application dated <b>${formatDateLong(data.applicationDate)}</b> and subsequent interview held on <b>${formatDateLong(data.interviewDate)}</b> we are pleased to offer you the post of <b>${data.position}</b> in our organization on the following terms and conditions.</div><p><b>Designation : ${data.position}</b><br><b>at Rs. ${data.salary} Per month</b><br><b>w.e.f ${formatDateLong(data.joiningDate)}</b></p><div class="body">The details of your remuneration are enumerated in Annexure A, enclosed. The payment of salary and benefits shall be subject to deduction of Income Tax as per the prevailing Income Tax rates and other statutory deductions, as may be required under the applicable Legislation in force from time to time. Your compensation will be renewed under the Company's policies from time to time, at the sole discretion of the Company.</div><div class="section">PROBATION & CONFIRMATION</div><div class="item"><b>1.</b> You will be on probation for the first 6 months of your employment. You will not be deemed to be confirmed until the letter of confirmation has been issued to you. During or at the expiry of the period of probation, your services are liable to be terminated at any time without notice or without assigning any reason or payment of compensation in lieu thereof.</div><div class="item"><b>2.</b> After confirmation, your employment can be terminated/discharged by giving one month's notice in writing or one month's salary/wages in lieu thereof by either side. Further, in case of resignation, the management reserves the right to accept the same with immediate effect.</div><div class="item"><b>3.</b> Your place of posting will, at present, be at <b>Greater Noida</b>. You are liable to be transferred/posted to any other establishment/branches of the company now in existence or that may come up in future.</div><div class="item"><b>4.</b> Your shift timings start from 9:30 AM and end at 6:30 PM, from Monday to Saturday or as decided by the Management, and your reporting time will be 9.20 AM.</div><div class="section">SALARY AND EMOLUMENTS</div><div class="item"><b>10.</b> Your Annual compensation will be as per Annexure A, subject to TDS and other Govt and statutory deductions as applicable from time to time. During the tenure of service, you will keep your emoluments secret from other members of this organization.</div><div style="margin-top:50px">Authorized Signatory<br><b>Amit Takkar</b><br>(Director)<br><b>TAKKAR POLYCHEM PVT. LTD.</b></div><div style="margin-top:50px">(Signature of Employee)<br><b>Accepted: _____________</b></div></body></html>`;
        }

        async function downloadPDF(html, filename) {
            try {
                const element = document.createElement('div');
                element.innerHTML = html;
                element.style.position = 'absolute';
                element.style.left = '-9999px';
                element.style.width = '210mm';
                document.body.appendChild(element);

                const options = {
                    margin: 10,
                    filename: filename + '.pdf',
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true, allowTaint: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                await html2pdf().set(options).from(element).save();
                document.body.removeChild(element);
                return true;
            } catch (error) {
                alert('Error generating PDF: ' + error.message);
                return false;
            }
        }

        document.getElementById('letterForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = getFormData();
            const loading = document.getElementById('loading');
            const success = document.getElementById('successMessage');

            loading.classList.add('show');
            success.classList.remove('show');

            if (await downloadPDF(generateOfferLetterHTML(data), `${data.candidateName}_Offer_Letter`)) {
                loading.classList.remove('show');
                success.textContent = '✓ Offer Letter downloaded!';
                success.classList.add('show');
                setTimeout(() => success.classList.remove('show'), 3000);
            } else {
                loading.classList.remove('show');
            }
        });

        document.getElementById('genAppt').addEventListener('click', async function() {
            const form = document.getElementById('letterForm');
            if (!form.checkValidity()) {
                alert('Please fill all required fields!');
                return;
            }

            const data = getFormData();
            const loading = document.getElementById('loading');
            const success = document.getElementById('successMessage');

            loading.classList.add('show');
            success.classList.remove('show');

            if (await downloadPDF(generateAppointmentLetterHTML(data), `${data.candidateName}_Appointment_Letter`)) {
                loading.classList.remove('show');
                success.textContent = '✓ Appointment Letter downloaded!';
                success.classList.add('show');
                setTimeout(() => success.classList.remove('show'), 3000);
            } else {
                loading.classList.remove('show');
            }
        });
    </script>
</body>
</html>
