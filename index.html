<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takkar Polychem - Letter Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .header h1 { font-size: 32px; font-weight: 700; margin-bottom: 10px; }
        .header p { font-size: 14px; opacity: 0.9; }
        .content { padding: 40px; }
        .form-section { margin-bottom: 40px; }
        .form-section h2 {
            font-size: 18px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .form-group { display: flex; flex-direction: column; }
        label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        input, textarea {
            padding: 12px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        textarea { resize: vertical; min-height: 70px; }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            min-width: 140px;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4); }
        .btn-secondary {
            background: #f5f5f5;
            color: #667eea;
            border: 2px solid #667eea;
            flex: 1;
            min-width: 140px;
        }
        .btn-secondary:hover { background: #667eea; color: white; }
        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }
        .success-message.show { display: block; }
        .loading { display: none; text-align: center; padding: 20px; color: #667eea; font-weight: 600; }
        .loading.show { display: block; }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        .letter-content {
            font-family: Calibri, Arial, sans-serif;
            font-size: 12px;
            line-height: 1.6;
            color: #000;
            padding: 40px;
            background: white;
        }
        @media (max-width: 600px) {
            .header h1 { font-size: 24px; }
            .content { padding: 20px; }
            .form-grid { grid-template-columns: 1fr; }
            button { min-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 Letter Generator</h1>
            <p>Takkar Polychem Pvt Ltd - Offer & Appointment Letters</p>
        </div>
        <div class="content">
            <div class="success-message" id="successMessage"></div>
            <div class="loading" id="loading">
                <span class="spinner"></span> Generating PDF...
            </div>
            <form id="letterForm">
                <div class="form-section">
                    <h2>Personal Information</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Candidate Name *</label>
                            <input type="text" id="candidateName" required>
                        </div>
                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" id="email" required>
                        </div>
                        <div class="form-group">
                            <label>Phone *</label>
                            <input type="tel" id="phone" required>
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Address *</label>
                            <textarea id="address" required></textarea>
                        </div>
                    </div>
                </div>
                <div class="form-section">
                    <h2>Employment Details</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Position *</label>
                            <input type="text" id="position" required>
                        </div>
                        <div class="form-group">
                            <label>Monthly Salary (Rs.) *</label>
                            <input type="number" id="salary" required>
                        </div>
                        <div class="form-group">
                            <label>Date of Joining *</label>
                            <input type="date" id="joiningDate" required>
                        </div>
                    </div>
                </div>
                <div class="form-section">
                    <h2>Document Dates</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Offer Letter Date *</label>
                            <input type="date" id="offerLetterDate" required>
                        </div>
                        <div class="form-group">
                            <label>Application Date *</label>
                            <input type="date" id="applicationDate" required>
                        </div>
                        <div class="form-group">
                            <label>Interview Date *</label>
                            <input type="date" id="interviewDate" required>
                        </div>
                    </div>
                </div>
                <div class="button-group">
                    <button type="submit" class="btn-primary">Generate Offer Letter</button>
                    <button type="button" id="genAppt" class="btn-primary">Generate Appointment</button>
                    <button type="reset" class="btn-secondary">Clear</button>
                </div>
            </form>
        </div>
    </div>
    <div id="letterContent" class="hidden"></div>

    <script>
        const { jsPDF } = window.jspdf;

        function formatDate(dateString) {
            const options = { day: '2-digit', month: 'short', year: 'numeric' };
            return new Date(dateString + 'T00:00:00').toLocaleDateString('en-US', options);
        }

        function getData() {
            return {
                name: document.getElementById('candidateName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                position: document.getElementById('position').value,
                salary: document.getElementById('salary').value,
                joiningDate: document.getElementById('joiningDate').value,
                offerDate: document.getElementById('offerLetterDate').value,
                appDate: document.getElementById('applicationDate').value,
                intDate: document.getElementById('interviewDate').value
            };
        }

        function createOfferLetter(d) {
            return `<div class="letter-content">
                <div style="text-align:center;margin-bottom:30px;">
                    <div style="font-size:14px;font-weight:bold;">TAKKAR POLYCHEM PRIVATE LIMITED</div>
                    <div style="font-size:9px;font-weight:bold;margin:5px 0;">(MANUFACTURERS OF SPECIALISED COMPOUNDS AND MASTER BATCHES)</div>
                    <div style="font-size:8px;line-height:1.5;">PLOT NO 19, ECOTECH - XII, GREATER NOIDA - 201308 (UP)<br>CIN NO. - U25209DL2022PTC392480 TAN NO. - DELT20112B<br>PHONE: +91-8178526417, Email: info@takkarpolychem.com</div>
                </div>
                <div style="margin-bottom:20px;">
                    <div>To,</div>
                    <div>Mr ${d.name},</div>
                    <div>${d.address}</div>
                </div>
                <div style="text-align:right;margin-bottom:20px;">Dated: - ${formatDate(d.offerDate)}</div>
                <div style="font-weight:bold;text-decoration:underline;margin-bottom:15px;">Subject: - Offer Letter for the post of ${d.position}</div>
                <p>Dear ${d.name.split(' ')[0]},</p>
                <p style="margin:15px 0;text-align:justify;">We are delighted to offer you the opportunity for the position of <b>${d.position}</b> with our Company <b>M/S Takkar Polychem Pvt Ltd</b>, Plot No 19, Ecotech XII, Greater Noida. This is a full-time role, and you will be reporting to <b>Mr. Amit Takkar (Director)</b>.</p>
                <p style="margin:15px 0;text-align:justify;">Your expected starting date is <b>${formatDate(d.joiningDate)}</b>. You will be asked to sign a confidentiality and non-disclosure agreement at the beginning of your employment.</p>
                <p style="margin:15px 0;text-align:justify;">We hope to offer you a challenging and rewarding career with a high level of job satisfaction and opportunities for career development.</p>
                <p style="margin:15px 0;text-align:justify;">Please sign the duplicate copy of this letter as an acceptance of our offer for the position of <b>${d.position}</b>.</p>
                <p style="margin:15px 0;text-align:justify;">We are all looking forward to your joining our team.</p>
                <div style="margin-top:30px;">Best regards,<br><br>For Takkar Polychem Pvt Ltd.<br><br>Amit Takkar<br>(Director)</div>
            </div>`;
        }

        function createAppointmentLetter(d) {
            return `<div class="letter-content">
                <div style="margin-bottom:20px;"><b>To,</b><br><b>Mr. ${d.name}</b><br>${d.address}<br>${d.phone}<br>${d.email}</div>
                <div style="font-weight:bold;text-transform:uppercase;margin:15px 0;text-decoration:underline;">Subject: APPOINTMENT LETTER</div>
                <p>Dear Madam,</p>
                <p style="margin:15px 0;text-align:justify;">With reference to your application dated <b>${formatDate(d.appDate)}</b> and subsequent interview held on <b>${formatDate(d.intDate)}</b> we are pleased to offer you the post of <b>${d.position}</b> in our organization on the following terms and conditions.</p>
                <p><b>Designation : ${d.position}</b><br><b>at Rs. ${d.salary} Per month</b><br><b>w.e.f ${formatDate(d.joiningDate)}</b></p>
                <p style="margin:15px 0;text-align:justify;">The details of your remuneration are enumerated in Annexure A, enclosed. The payment of salary and benefits shall be subject to deduction of Income Tax as per the prevailing Income Tax rates and other statutory deductions, as may be required under the applicable Legislation in force from time to time. Your compensation will be renewed under the Company's policies from time to time, at the sole discretion of the Company.</p>
                <div style="font-weight:bold;text-decoration:underline;margin:20px 0 10px 0;">PROBATION & CONFIRMATION</div>
                <p style="margin:10px 0;"><b>1.</b> You will be on probation for the first 6 months of your employment. You will not be deemed to be confirmed until the letter of confirmation has been issued to you. During or at the expiry of the period of probation, your services are liable to be terminated at any time without notice or without assigning any reason or payment of compensation in lieu thereof.</p>
                <p style="margin:10px 0;"><b>2.</b> After confirmation, your employment can be terminated/discharged by giving one month's notice in writing or one month's salary/wages in lieu thereof by either side. Further, in case of resignation, the management reserves the right to accept the same with immediate effect.</p>
                <p style="margin:10px 0;"><b>3.</b> Your place of posting will, at present, be at <b>Greater Noida</b>. You are liable to be transferred/posted to any other establishment/branches of the company now in existence or that may come up in future.</p>
                <p style="margin:10px 0;"><b>4.</b> Your shift timings start from 9:30 AM and end at 6:30 PM, from Monday to Saturday or as decided by the Management, and your reporting time will be 9.20 AM.</p>
                <div style="font-weight:bold;text-decoration:underline;margin:20px 0 10px 0;">SALARY AND EMOLUMENTS</div>
                <p style="margin:10px 0;"><b>10.</b> Your Annual compensation will be as per Annexure A, subject to TDS and other Govt and statutory deductions as applicable from time to time. During the tenure of service, you will keep your emoluments secret from other members of this organization.</p>
                <div style="margin-top:50px;">Authorized Signatory<br><b>Amit Takkar</b><br>(Director)<br><b>TAKKAR POLYCHEM PVT. LTD.</b></div>
                <div style="margin-top:50px;">(Signature of Employee)<br><b>Accepted: _____________</b></div>
            </div>`;
        }

        async function makePDF(html, filename) {
            try {
                const container = document.getElementById('letterContent');
                container.innerHTML = html;
                container.classList.remove('hidden');
                
                const canvas = await html2canvas(container, {
                    scale: 2,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#ffffff'
                });

                const imgData = canvas.toDataURL('image/png');
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                const imgWidth = pageWidth - 10;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;

                let position = 5;
                let heightLeft = imgHeight;

                pdf.addImage(imgData, 'PNG', 5, position, imgWidth, imgHeight);
                heightLeft -= pageHeight - 10;

                while (heightLeft > 0) {
                    position = heightLeft - imgHeight + 5;
                    pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 5, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight - 10;
                }

                pdf.save(filename + '.pdf');
                container.classList.add('hidden');
                return true;
            } catch (err) {
                alert('Error: ' + err.message);
                console.error(err);
                return false;
            }
        }

        document.getElementById('letterForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const d = getData();
            const load = document.getElementById('loading');
            const msg = document.getElementById('successMessage');
            load.classList.add('show');
            msg.classList.remove('show');
            
            if (await makePDF(createOfferLetter(d), `${d.name}_Offer_Letter`)) {
                load.classList.remove('show');
                msg.textContent = '✓ Offer Letter Downloaded!';
                msg.classList.add('show');
                setTimeout(() => msg.classList.remove('show'), 3000);
            } else {
                load.classList.remove('show');
            }
        });

        document.getElementById('genAppt').addEventListener('click', async function() {
            if (!document.getElementById('letterForm').checkValidity()) {
                alert('Fill all fields!');
                return;
            }
            const d = getData();
            const load = document.getElementById('loading');
            const msg = document.getElementById('successMessage');
            load.classList.add('show');
            msg.classList.remove('show');
            
            if (await makePDF(createAppointmentLetter(d), `${d.name}_Appointment_Letter`)) {
                load.classList.remove('show');
                msg.textContent = '✓ Appointment Letter Downloaded!';
                msg.classList.add('show');
                setTimeout(() => msg.classList.remove('show'), 3000);
            } else {
                load.classList.remove('show');
            }
        });
    </script>
</body>
</html>
